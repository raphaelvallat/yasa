name: PyTest

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python_tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python_tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1
  UV_SYSTEM_PYTHON: 1
  YASA_DATA_DIR: ${{ github.workspace }}/.yasa_data

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]

    runs-on: ${{ matrix.platform }}
    env:
      COVERAGE_JOB: ${{ matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.14' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          prune-cache: false

      - name: Cache sample data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.yasa_data
          key: yasa-sample-data-14564285

      - name: Install libomp (macOS)
        if: ${{ matrix.platform == 'macos-latest' }}
        run: brew install libomp

      - name: Install dependencies
        run: uv pip install --group=test ".[full]"

      # Use the environment installed above: `uv run` would create and sync a separate .venv
      - name: Test with pytest
        if: env.COVERAGE_JOB != 'true'
        run: pytest --verbose

      # Coverage is measured on one job only, instead of a separate job running the same tests
      - name: Test with pytest and coverage
        if: env.COVERAGE_JOB == 'true'
        run: pytest --cov --cov-report=xml --verbose

      - name: Upload coverage to Codecov
        if: env.COVERAGE_JOB == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Fork PRs have no access to the token: do not fail them on a rejected upload
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  # Test against different dependency versions
  test-dependency-combinations:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        deps:
          # Minimum supported versions (as defined in pyproject.toml)
          - python-version: "3.11"
            numpy: "numpy==2.2.2"
            scipy: "scipy==1.15.0"
            pandas: "pandas==2.3.0"
            mne: "mne==1.10.0"
            others: >-
              matplotlib==3.10.1 seaborn==0.13.2 antropy==0.1.9 scikit-learn==1.6.1
              lspopt==1.4.0 lightgbm==4.6.0 pooch==1.8.0 sleepecg==0.5.9 pyriemann==0.8
            label: "minimum-versions"

          # The latest versions are tested in the test job

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.deps.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.deps.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          prune-cache: false
          cache-suffix: ${{ matrix.deps.label }}

      - name: Cache sample data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.yasa_data
          key: yasa-sample-data-14564285

      - name: Install numpy (${{ matrix.deps.label }})
        run: uv pip install "${{ matrix.deps.numpy }}"

      - name: Install dependencies (${{ matrix.deps.label }})
        run: >-
          uv pip install --group=test ".[full]"
          "${{ matrix.deps.scipy }}"
          "${{ matrix.deps.pandas }}"
          "${{ matrix.deps.mne }}"
          ${{ matrix.deps.others }}

      - name: Display installed versions
        run: uv pip list

      - name: Test with pytest
        run: pytest --verbose
