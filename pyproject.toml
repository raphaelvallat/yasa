[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yasa"
description = "YASA: Analysis of polysomnography recordings."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Raphael Vallat", email = "raphaelvallat9@gmail.com"},
    {name = "Remington Mallett", email = "mallett.remy@gmail.com"},
]
maintainers = [
    {name = "Raphael Vallat", email = "raphaelvallat9@gmail.com"},
    {name = "Remington Mallett", email = "mallett.remy@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.2",
    "scipy>=1.15",
    "pandas>=2.3",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "mne>=1.10",
    "antropy>=0.1.9",
    "scikit-learn>=1.6.1",
    "lspopt>=1.4",
    "joblib",
    "lightgbm>=4.6",
    "pooch>=1.8",
]

[project.optional-dependencies]
heart = ["sleepecg>=0.5.9"]
art   = ["pyriemann>=0.8"]
plot  = ["ipywidgets"]
full  = ["yasa[heart,art,plot]"]

[dependency-groups]
dev = [
    "ruff==0.16.10",  # Keep in sync with .pre-commit-config.yaml
]
test = [
    "pytest>=6",
    "pytest-cov",
    # Ensure coverage is new enough for `source_pkgs`.
    "coverage[toml]>=5.3",
]
docs = [
    "sphinx>=8.1",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinx-notfound-page>=1",
    "sphinx-reredirects>=0.1",
    "pydata-sphinx-theme>0.16",
    "numpydoc>=1.8",
]

[project.urls]
Homepage = "https://github.com/raphaelvallat/yasa/"
Downloads = "https://github.com/raphaelvallat/yasa/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
yasa = [
    "classifiers/*.joblib",
]

[tool.setuptools.packages.find]
namespaces = false
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "yasa.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--showlocals --durations=10"  # --cov
doctest_optionflags= ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
filterwarnings = [
    # The pre-trained classifiers bundled with YASA were pickled with an older scikit-learn
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
    # Fail on deprecation warnings triggered by YASA code, e.g. a deprecated pandas or NumPy API
    "error::FutureWarning:yasa",
    "error::DeprecationWarning:yasa",
    # ... except those of YASA's own deprecated functions, called in their docstring examples
    "ignore:The `yasa\\..*` function is deprecated",
]
markers = ["slow"]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/classifiers/*",
]
source_pkgs = ["yasa"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
# sort = "Cover"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "__init__.py",  # Skip init files bc they use star imports (breaking rules F401, F403)
    "notebooks",  # Skip jupyter notebook examples
    "docs",
    "*.md",  # Skip Markdown files (ruff >= 0.16 formats their Python code blocks)
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.flake8-import-conventions.aliases]
"matplotlib.pyplot" = "plt"
numpy = "np"
"numpy.typing" = "npt"
pandas = "pd"
seaborn = "sns"
scipy = "sp"

[tool.ruff.lint]
select = [
    "E4",  # Subset of pycodestyle rules
    "E7",  # Subset of pycodestyle rules
    "E9",  # Subset of pycodestyle rules
    "F",  # All Pyflakes rules
    "NPY",  # numpy
    "W",
    "I",
]

ignore = [
    "NPY002",  # exclude numpy random
]
